# Evaluation dataset: 60 synthetic cases, 10 per category.
# split: dev (used while building) | heldout (written up front, never used for tuning; reported separately)
#
# Fields
#   customer / order / message      who complains, about which order (order may be inferred), in what words
#   applicable_policy                governing policy document (null = none applies)
#   allowed_actions / forbidden_actions
#       actions: answer, clarify, propose_refund, refund, escalate
#   approval_required                a human approval must be granted before any money moves
#   setup                            faults: mock-service faults | llm_faults: [agent, mode, times] |
#                                    crash: crash point | inject_policy: true | concurrent_ticket: message
#   steps                            actions after the first run pauses: approve/reject (reviewer),
#                                    reply (message), expire_approval, approve_expect (reviewer, status),
#                                    customer_approve_attempt, concurrent_approve (n)
#   expect                           status, outcome, refund_total_minor, refund_count, clarification,
#                                    escalation, reason (decision reason or escalation reason prefix)

