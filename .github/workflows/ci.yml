name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.32"
  PYTHON_VERSION: "3.12"

jobs:
  backend:
    name: Backend (lint, types, migrations, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: support
          POSTGRES_PASSWORD: support
          POSTGRES_DB: support_agent_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U support -d support_agent_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://support:support@localhost:5432/support_agent_test
      DATABASE_URL: postgresql+psycopg://support:support@localhost:5432/support_agent_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        run: pip install "uv==${UV_VERSION}"
      - name: Verify lockfile and install dependencies
        run: |
          uv lock --check
          uv sync --frozen --all-extras
      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy app mock_services scripts
      - name: Import / startup check
        run: uv run python -c "import app.main, app.worker, mock_services.main; print('imports ok')"
      - name: Migrations (upgrade, drift check, downgrade, upgrade)
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Unit, integration and failure-scenario tests
        run: uv run pytest -q --timeout 120
      - name: Evaluation harness (mock LLM)
        env:
          EVAL_DATABASE_URL: postgresql+psycopg://support:support@localhost:5432/support_agent_eval
        run: |
          uv run python -m evals.run_evals
          python - <<'EOF'
          import json
          r = json.load(open("evals/reports/latest.json"))
          for mode, s in r["summary"].items():
              a = s["all"]
              print(mode, a["workflow_correctness"], "unauthorized", a["unauthorized_actions"], "duplicates", a["duplicate_refunds"])
              assert a["unauthorized_actions"] == 0 and a["duplicate_refunds"] == 0, "safety invariant violated"
          EOF
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: evals/reports/latest.*
          if-no-files-found: ignore

  frontend:
    name: Frontend (typecheck, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://api.example.invalid

  docker:
    name: Docker images and compose config
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Build backend image
        run: docker build -t support-agent-backend:ci .
      - name: Build frontend image
        run: docker build --build-arg VITE_API_BASE_URL=https://api.example.invalid -t support-agent-frontend:ci frontend
      - name: Backend image smoke test
        run: docker run --rm support-agent-backend:ci python -c "import app.main, app.worker, mock_services.main; print('ok')"
