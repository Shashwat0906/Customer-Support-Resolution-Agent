[project]
name = "customer-support-resolution-agent"
version = "0.1.0"
description = "Agentic customer-support resolution workflow with human approval, idempotent refunds and verification."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
    "alembic",
    "psycopg[binary,pool]",
    "langgraph",
    "langgraph-checkpoint-postgres",
    "httpx",
    "pyjwt",
    "pyyaml",
]

[project.optional-dependencies]
anthropic = ["anthropic"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-timeout",
    "ruff",
    "mypy",
    "types-pyyaml",
]

[tool.uv]
package = false
