[project]
name = "customer-support-resolution-agent"
version = "0.1.0"
description = "Agentic customer-support resolution workflow with human approval, idempotent refunds and verification."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
    "alembic",
    "psycopg[binary,pool]",
    "langgraph",
    "langgraph-checkpoint-postgres",
    "httpx",
    "pyjwt",
    "pyyaml",
]

[project.optional-dependencies]
anthropic = ["anthropic"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-timeout",
    "ruff",
    "mypy",
    "types-pyyaml",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["frontend", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "B008", "RUF012", "S311", "SIM117", "SIM300"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "E501", "RUF059"]
"evals/**" = ["S105", "S106"]
"app/config.py" = ["S105"]
"app/schemas/api.py" = ["S105"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["frontend/", "migrations/versions/"]
